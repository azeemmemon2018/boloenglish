<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Headphones arc -->
  <path d="M 140 270 A 116 116 0 0 1 372 270" fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round"/>
  
  <!-- Headphone earcups -->
  <rect x="110" y="240" width="36" height="70" rx="18" fill="#38bdf8"/>
  <rect x="366" y="240" width="36" height="70" rx="18" fill="#4ade80"/>
  
  <!-- Central Speech Bubble / Sound Waves -->
  <path d="M 190 290 Q 180 340 230 350 L 220 375 L 260 350 H 310 Q 340 350 340 310 Q 340 270 290 270 Z" fill="#ffffff" fill-opacity="0.95"/>
  
  <!-- Sound waves inside bubble -->
  <line x1="225" y1="310" x2="225" y2="310" stroke="#0e7490" stroke-width="6" stroke-linecap="round"/>
  <line x1="245" y1="298" x2="245" y2="322" stroke="#0e7490" stroke-width="6" stroke-linecap="round"/>
  <line x1="265" y1="290" x2="265" y2="330" stroke="#0f766e" stroke-width="6" stroke-linecap="round"/>
  <line x1="285" y1="302" x2="285" y2="318" stroke="#0f766e" stroke-width="6" stroke-linecap="round"/>

  <!-- Urdu & English badge marks -->
  <circle cx="210" cy="180" r="22" fill="#38bdf8" fill-opacity="0.3"/>
  <text x="210" y="187" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">EN</text>
  
  <circle cx="302" cy="180" r="22" fill="#4ade80" fill-opacity="0.3"/>
  <text x="302" y="188" font-family="sans-serif" font-weight="bold" font-size="20" fill="#ffffff" text-anchor="middle">اردو</text>

  <!-- Connective arrow -->
  <path d="M 240 180 L 272 180" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3"/>
</svg>
